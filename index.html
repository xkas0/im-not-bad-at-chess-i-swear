<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Swear I’m Good at Chess</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rain"></div>
<div id="world"><div class="ly sky"></div><div class="ly hills"></div><div class="ly ground"></div><div class="ly bushes"></div><div id="cap"></div></div>
<main>
  <h1>I Swear I’m Good at Chess</h1>
  <p class="tag">Find the move that loses the most.</p>
  <section id="game">
    <p class="tag" style="margin:0 0 6px">Score <b id="score">0</b><span id="score-fruit"></span></p>
    <div id="dots"></div>
    <div id="boardwrap">
      <div class="evalbar"><i id="evalfill"></i><b id="evaltext">0.0</b></div>
      <div id="boardbox"><div id="board"></div><div id="fx"></div></div>
    </div>
    <div id="timer"><svg class="crown" viewBox="0 0 48 40" aria-hidden="true"><path d="M5 34 L2 10 L15 20 L24 4 L33 20 L46 10 L43 34 Z" fill="#ffc83d" stroke="#1b1020" stroke-width="3.5" stroke-linejoin="round"/><circle cx="24" cy="4.5" r="3" fill="#ff4d6d" stroke="#1b1020" stroke-width="2"/></svg>
      <div class="track"><i id="clockfill"></i></div><b id="clocktext">30s</b></div>
    <p id="status"></p>
  </section>
  <section id="final" hidden></section>
</main>
<div id="overlay" hidden></div>
<script src="script.js"></script>
<script src="rain.js"></script>
</body>
</html>
